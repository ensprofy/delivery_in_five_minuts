<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Доставка за 5 минут</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <main id="stage">
    <div class="screen">
      <canvas id="game" width="320" height="180"></canvas>

      <div class="hud">
        <span>ЭТАП 3</span>
      </div>
      <div id="timer" class="timer">5:00</div>
      <div id="dist" class="dist">1000 м</div>

      <div id="toast" class="toast" aria-live="polite"></div>

      <div id="title" class="title">
        <h1>ДОСТАВКА<br>ЗА 5 МИНУТ</h1>
        <p class="sub">Отнеси пиццу в дом №42 в конце улицы.<br>Собирай часики: красные +5 сек, золотые +15 сек.<br>Найди скейт — он разгоняет!</p>
        <p class="blink">НАЖМИ ЛЮБУЮ КЛАВИШУ</p>
        <p class="hint">← → ходить · ПРОБЕЛ прыжок · ↓ сойти со скейта · R на базу · M звук · N музыка</p>
      </div>

      <div id="result" class="title result" hidden>
        <h1 id="result-title"></h1>
        <p id="result-text" class="sub"></p>
        <p class="blink">ПРОБЕЛ — ЕЩЁ РАЗ</p>
      </div>
    </div>
  </main>

  <div class="pad" aria-label="Управление">
    <div class="pad-dir">
      <button data-action="left" aria-label="Влево">◀</button>
      <button data-action="right" aria-label="Вправо">▶</button>
    </div>
    <button class="pad-base pad-music" data-music aria-label="Музыка вкл/выкл">♪</button>
    <button class="pad-base" data-base aria-label="На базу">R</button>
    <button class="pad-jump" data-action="jump" aria-label="Прыжок">A</button>
  </div>

  <script src="js/audio.js?v=17"></script>
  <script src="js/sprites.js?v=17"></script>
  <script src="js/game.js?v=17"></script>
</body>
</html>
